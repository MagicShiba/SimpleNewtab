<!DOCTYPE html><!-- 注释 -->
<html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="jquery.js"></script>

<script src="ntp.js"></script>
<link rel="stylesheet" href="ntp.css">
<title>起始页</title>
<style>
    #Div_seting {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 4em;
        height: 4em;
		transition: opacity 0.5s;
		opacity: 0.5;
        background-color:#66666600;
        cursor: pointer;
		background-image:url(../src/his.png);
		background-repeat: no-repeat;
		background-size: contain;
		z-index:999;
    }
    #Div_seting:hover {
		opacity:1;
        background-color:#424251;
    }
	
    #Div_seting_hid {
        display: none;
        position: fixed;
        top: 2px;
        right: 2px;
		width:15em;
        box-shadow: 0 0 0 2px #0ff;
		height: calc(100% - 4px);
        background-color: #444444;
		z-index:1;
    }
#inputWindow {
	width: 300px;
	background-color: #333d;
	margin: 0 auto;
	padding: 10px;
	text-align: center;
	position: absolute;
	box-shadow: 0px 0px 8px 0px #fff;
	z-index:998;
	display: none;
	
}
.ipt {
    width: 100%;
	font-size: 1.1em;
	color: white;
	background:#000;
}
.btn{
    margin: 1px;
	border: 1px solid #444;
	width: 100%;
	height: 3em;
	margin-bottom: -5px;
  color: white;
	background-color: #222;
}
.btn:hover{
	box-shadow: 0 0 0 2px #0ff;
	background-color: #555;
	
}
._title{
font-size: 1.2em;
margin:0.3em;
color:white;
}
.div_btn{
display: flex;
font-size: 1.2em;
color:white;
}
</style>

<body >

<div id="Div_seting"></div><!-- menu按钮 -->
<div id="Div_seting_hid">待定</div><!-- history -->
<div id="inputWindow">
    <p class="_title">标题:</p>
    <textarea type="text" id="u_title" class="ipt" maxlength="20" placeholder="输入标题~"></textarea><br>
    <p class="_title">URL:</p>
    <textarea type="text" id="u_url" class="ipt" placeholder="输入url~" rows="5" style="width: 100%;"></textarea>
    <div class="div_btn">
    <button class="btn" id="btncancel">取消</button><button class="btn" id="btnok">确定</button> 
    </div>
</div>


  <div class="container">
    <div class="left-div">
      <h2>收藏</h2><p>从右侧拖动过来新建收藏。</p>
      <div id='fov-list'>
      
	  
	  </div>
	  
    </div>
    <div class="right-div">
      <h2>最近访问</h2>这由浏览器自动生成。
      <div id='most-visited-list'>
      </div>
    </div>
  </div>
  





</body>
</html>
