<!DOCTYPE html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="ntp.js"></script>
<link rel="stylesheet" href="ntp.css">
<title>起始页</title>
<body>

<div id="top-right-icons">
  <div id="Div_seting" title="设置">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#ccc" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </div>
  <div id="Div_history_icon" title="历史记录">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#ccc" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
  </div>
</div>

<div id="Div_seting_hid">
  <h3 class="panel-title">设置</h3>
  <label class="toggle-label"><input type="checkbox" id="showFav" checked> 显示收藏</label>
  <label class="toggle-label"><input type="checkbox" id="showRecent" checked> 显示最近访问</label>
  <label class="toggle-label"><input type="checkbox" id="enableBlur"> 模糊地址(截图用)</label>
  <label class="toggle-label"><input type="checkbox" id="lightMode"> 亮色模式</label>
  <label class="toggle-label"><input type="checkbox" id="showClock" checked> 显示时钟</label>
  <div class="setting-divider"></div>
  <h4 class="setting-subtitle">壁纸</h4>
  <input type="text" id="wallpaperUrl" class="ipt" placeholder="壁纸图片URL...">
  <input type="file" id="wallpaperFile" accept="image/*" hidden>
  <div class="btn-row">
    <button id="wallpaperFileBtn" class="btn">选择本地图片</button>
    <button id="clearWallpaper" class="btn">清除壁纸</button>
  </div>
  <select id="wallpaperFit" class="ipt">
    <option value="cover">覆盖 (Cover)</option>
    <option value="contain">包含 (Contain)</option>
    <option value="fill">拉伸 (Fill)</option>
    <option value="none">原始 (None)</option>
    <option value="repeat">平铺 (Repeat)</option>
  </select>
  <div class="range-row">
    <label>分辨率限制:</label>
    <input type="number" id="wallpaperMaxSize" min="10" value="1920" class="ipt">
    <span">px</span>
  </div>
  <div class="range-row">
    <label>背景模糊:</label>
    <input type="range" id="wallpaperBlur" min="0" max="20" value="0">
    <span id="wallpaperBlurVal">0px</span>
  </div>
  <div class="range-row">
    <label>背景亮度:</label>
    <input type="range" id="wallpaperBrightness" min="1" max="150" value="100">
    <span id="wallpaperBrightnessVal">100%</span>
  </div>
  <div class="range-row">
    <label>前景透明度:</label>
    <input type="range" id="panelOpacity" min="0" max="100" value="100">
    <span id="panelOpacityVal">100%</span>
  </div>
    <div class="setting-divider"></div>
  <h4 class="setting-subtitle">插件窗口显示组</h4>
  <div id="popupGroupList"></div>
</div>

<div id="Div_history_hid">
  <h3 class="panel-title">历史记录</h3>
  <input type="text" id="historySearch" class="ipt" placeholder="搜索历史...">
  <div id="history-list"></div>
</div>

<div id="groupMenu">
  <div class="ctx-item" id="groupRename">重命名</div>
  <div class="ctx-item" id="groupDelete">删除分组</div>
</div>
<div id="contextMenu">
  <div class="ctx-item" id="ctxAddFav">添加到收藏</div>
  <div class="ctx-item" id="ctxEdit">编辑</div>
  <div class="ctx-item" id="ctxDelete">删除</div>
</div>

<div id="inputWindow">
  <p class="_title">标题:</p>
  <input type="text" id="u_title" class="ipt" maxlength="20" placeholder="输入标题~">
  <p class="_title">URL:</p>
  <input type="text" id="u_url" class="ipt" placeholder="输入url~">
  <p class="_title">图标:</p>
  <div id="iconOptions"></div>
  <input type="hidden" id="u_icon" value="">
  <div class="div_btn">
    <button class="btn" id="btndelete" style="display:none">删除</button><button class="btn" id="btncancel">取消</button><button class="btn" id="btnok">确定</button>
  </div>
</div>

<div class="container">
  <div class="left-div" id="left-drop-zone">
    <div class="group-bar"><h2 class="group-title">收藏</h2><div class="group-tabs" id="groupTabs"></div><div class="group-add-btn" id="groupAddBtn">+</div></div>
    <p>从右侧拖动链接到此处添加收藏。</p>
    <div class="drop-hint" id="dropHint">释放以添加收藏</div>
    <div id="fov-list"></div>
  </div>
  <div class="right-div">
    <h2>最近访问</h2><p>这由浏览器自动生成。</p>
    <div id='most-visited-list'></div>
  </div>
</div>
<div id="wallpaper-bg-wrap"><div id="wallpaper-bg"></div></div>
<div id="datetime"><div id="clockDate"></div><div id="clockTime"></div></div>
</body>
</html>
